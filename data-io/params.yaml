# One params file for every entry script. Each block belongs to one of them.
#
#   nextflow run pacbio.nf -profile cluster,hot -params-file params.yaml
#
# Storage paths are deliberately NOT here. They come from the tier profile
# (-profile hot | cold) in nextflow.config, because the paths are the one thing
# that must differ between the two arms - everything else has to stay identical
# or the comparison means nothing.
#
# Samplesheets are BUILT from the input folders, the way nf-dnaseq does it: each
# entry script scans <tier root>/tests/data-io/input/<platform>/ and writes a
# samplesheet to <outdir>/samplesheet/samplesheet.csv. Nothing to maintain by
# hand, and the two tiers cannot drift apart because each derives its paths from
# its own input dir. Pass --samplesheet <file> to use an explicit one instead.

# Reference for each platform, relative to <tier root>/references/.
# These land in the generated samplesheet's `reference` column.
references:
  illumina: 'ecoli/syn57/syn57_evo/Syn57_evo2.fa'
  pacbio:   'plasmids/plasmids/pFR494_pRT300_rham_wt.fa'
  ont:      'other/simon_methylation/wt-0248-tdk_kan.fa'

# --- illumina.nf ---
# Nothing else to configure: bwa on CPU, by design. See PLAN.md open decision 3.

# --- pacbio.nf ---
pacbio:
  input_type: ubam    # 'ubam' (HiFi reads) or 'fastq'
  device: cpu         # 'cpu' = minimap2, 'gpu' = pbrun minimap2

# --- ont.nf ---
# Named `basecalling`, not `ont`: the dorado module reads
# params.basecalling.model and .modified_bases directly, and it is a submodule
# we do not edit.
basecalling:
  # Baked into the dorado image. A bare model name would make Dorado download
  # it, adding network time to an IO measurement.
  model: '/opt/models/dna_r10.4.1_e8.2_400bps_sup@v5.0.0'
  # Canonical bases only: modified-base calling is a second variable.
  modified_bases: '6ma'

# --- verify.nf ---
verify:
  reps: 3             # read every file this many times, as separate tasks
